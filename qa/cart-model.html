<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小吃车验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:300px;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{padding:7px;margin:3px}</style><div id="view"></div><aside><strong>小吃车 · 正式GLB</strong><div><button id="front">正面</button><button id="back">背面</button><button id="fallback">测试文件缺失回退</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,DOG_SPOTS,TUNING} from '../src/config.js';import {localToWorld,rotate2,propMeta} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
function root(cfg){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k]}for(const a of Object.values(cfg.accessories||{}))root(a)}for(const c of Object.values(ASSETS))root(c);
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer),spec=LAYOUT.find(s=>s.key==='cart'),out=document.querySelector('#result'),checks=[];
function verify(name,p){checks.push({name,passed:p});if(!p)throw Error(name)}function print(){out.textContent=checks.map(x=>`${x.passed?'通过':'失败'}：${x.name}`).join('\n');out.dataset.status=checks.every(x=>x.passed)?'passed':'failed'}
function look(back=false){const d=rotate2(back?-1.8:1.8,back?-5.5:5.5,spec.ry);street.setCameraPose(new C.Cartesian3(spec.x,spec.y,1.2),new C.Cartesian3(spec.x+d[0],spec.y+d[1],3));}
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU加载超时')}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
try{await street.build();look();const models=street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).endsWith('/cart.glb'));verify('正式GLB替换占位小吃车',models.length===1);const e=models[0];verify('Cesium GPU渲染就绪',(await ready(e)).ready);verify('米制比例且不强制放大',e.model.scale.getValue()===1&&e.model.minimumPixelSize.getValue()===0);verify('车轮底部锚点贴地',C.Cartesian3.distance(e.position.getValue(),localToWorld(street.frame,spec.x,spec.y,0))<1e-6);
const f=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(e.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3()),local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),f,new C.Cartesian3());verify('按布局0.25弧度旋转',Math.abs(local.x-Math.sin(spec.ry))<1e-6&&Math.abs(local.y-Math.cos(spec.ry))<1e-6);
const bytes=await (await fetch(ASSETS.cart.glb)).arrayBuffer(),n=new DataView(bytes).getUint32(12,true),g=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,n)));verify('暖色灯泡发光强度2.5',g.materials.some(m=>m.name==='cart_warm_bulb'&&m.emissiveFactor?.[0]>0&&m.extensions?.KHR_materials_emissive_strength?.emissiveStrength===2.5));verify('展示窗与整车使用不透明材质',g.materials.every(m=>(m.alphaMode||'OPAQUE')==='OPAQUE'));verify('没有实时灯或摄像机',!g.cameras?.length&&!g.extensions?.KHR_lights_punctual);
const cfg=ASSETS.cart.collider;verify('独立车身代理宽深收缩8%',Math.abs(cfg.footprint[1]-cfg.footprint[0]-1.84)<1e-6&&Math.abs(cfg.footprint[3]-cfg.footprint[2]-.69)<1e-6);const b=propMeta(spec).box;verify('碰撞高度排除篷布与灯泡',b.height===2.15);
const center=rotate2(0,-.115,spec.ry);verify('车身阻挡',street.blocked(spec.x+center[0],spec.y+center[1]));verify('可绕过车身边缘',!street.blocked(b.x1+TUNING.heroRadius+.03,(b.y0+b.y1)/2));
for(let i=0;i<3;i++){street.placeDog(i);street.s.x=TUNING.spawn.x;street.s.y=TUNING.spawn.y;verify(`藏点${i+1}出生点被遮挡`,!street.hasLineOfSight());street.s.playing=true;street.s.found=false;verify(`藏点${i+1}绕行可达并可确认`,route());street.s.x=DOG_SPOTS[i].x;street.s.y=DOG_SPOTS[i].y+.7;verify(`藏点${i+1}近处可确认`,street.canConfirm())}look();print();document.querySelector('#front').onclick=()=>look();document.querySelector('#back').onclick=()=>look(true);
document.querySelector('#fallback').onclick=async()=>{const old=ASSETS.cart.glb;ASSETS.cart.glb='/assets/models/intentionally-missing-cart.glb';try{const probe=new StreetScene(viewer);await probe.addObject(spec);verify('文件缺失回退且保留碰撞',probe.entities.length>1&&probe.entities.every(e=>!e.model)&&probe.colliders.length===1&&probe.solids.length===1);for(const e of probe.entities)viewer.entities.remove(e);print()}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed'}finally{ASSETS.cart.glb=old}};
}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
