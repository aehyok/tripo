<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>路灯验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:300px;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{padding:7px;margin:3px}</style><div id="view"></div><aside><strong>路灯 · 正式GLB</strong><div><button id="front">正面</button><button id="back">背面</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,TUNING,SMALL_COLLIDER} from '../src/config.js';import {localToWorld,rotate2,propMeta} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
function root(cfg){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k]}for(const a of Object.values(cfg.accessories||{}))root(a)}for(const c of Object.values(ASSETS))root(c);
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer),spec=LAYOUT.find(s=>s.key==='lamp'),out=document.querySelector('#result'),checks=[];
function verify(name,p){checks.push({name,passed:p});if(!p)throw Error(name)}function print(){out.textContent=checks.map(x=>`${x.passed?'通过':'失败'}：${x.name}`).join('\n');out.dataset.status=checks.every(x=>x.passed)?'passed':'failed'}
function look(back=false){const d=rotate2(back?-1.2:1.2,back?-4.6:4.6,spec.ry);street.setCameraPose(new C.Cartesian3(spec.x,spec.y,2.2),new C.Cartesian3(spec.x+d[0],spec.y+d[1],2.4));}
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU加载超时')}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
try{await street.build();look();const models=street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).endsWith('/lamp.glb'));verify('正式GLB替换占位路灯',models.length===1);const e=models[0],p=await ready(e);
verify('Cesium GPU渲染就绪',p.ready);verify('米制比例且不强制放大',e.model.scale.getValue()===1&&e.model.minimumPixelSize.getValue()===0);verify('底座贴地于布局位置',C.Cartesian3.distance(e.position.getValue(),localToWorld(street.frame,spec.x,spec.y,spec.z||0))<1e-6);
const f=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(e.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3()),local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),f,new C.Cartesian3());verify('正面朝街道',Math.abs(local.x-Math.sin(spec.ry))<1e-6&&Math.abs(local.y-Math.cos(spec.ry))<1e-6);
const c=C.Matrix4.multiplyByPoint(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),p.boundingSphere.center,new C.Cartesian3());verify('总高3.2米居中',Math.hypot(c.x-spec.x,c.y-spec.y)<.02&&Math.abs(c.z-(spec.z||0)-1.6)<.02);
const bytes=await (await fetch(ASSETS.lamp.glb)).arrayBuffer(),n=new DataView(bytes).getUint32(12,true),g=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,n))),tri=g.meshes.flatMap(x=>x.primitives).reduce((t,q)=>t+g.accessors[q.indices].count/3,0),m=g.materials[0];
verify(`${tri}三角面在1,500预算内`,tri<=1500);verify('灯罩发光贴图与强度2.0',m.emissiveTexture!==undefined&&m.extensions?.KHR_materials_emissive_strength?.emissiveStrength===2);verify('不透明材质、1K贴图',(m.alphaMode||'OPAQUE')==='OPAQUE'&&g.images.length===4);verify('没有实时灯或摄像机',!g.cameras?.length&&!g.extensions?.KHR_lights_punctual);
verify('底座阻挡',street.blocked(spec.x,spec.y));verify('可贴底座绕过',!street.blocked(spec.x+SMALL_COLLIDER.lamp+TUNING.heroRadius+.03,spec.y));verify('碰撞盒为底座半径收缩8%',Math.abs(SMALL_COLLIDER.lamp-.2383*.92)<.005);const b=propMeta(spec).box;verify('提示区域覆盖灯头',b.x1-b.x0>=.66&&b.y1-b.y0>=.67&&b.height===3.2);
for(let i=0;i<3;i++){street.placeDog(i);street.s.playing=true;street.s.found=false;verify(`藏点${i+1}绕行可达并可确认`,route())}
const old=ASSETS.lamp.glb;ASSETS.lamp.glb='/assets/models/intentionally-missing-lamp.glb';try{const probe=new StreetScene(viewer);await probe.addObject(spec);verify('文件缺失回退占位并保留碰撞',probe.entities.length===5&&probe.entities.every(x=>!x.model)&&probe.colliders.length===1);for(const x of probe.entities)viewer.entities.remove(x)}finally{ASSETS.lamp.glb=old}
look(location.hash==='#back');print();document.querySelector('#front').onclick=()=>look();document.querySelector('#back').onclick=()=>look(true);
}catch(e){print();out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
