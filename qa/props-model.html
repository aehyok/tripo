<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>手建道具验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:320px;max-height:92vh;overflow:auto;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{padding:7px;margin:3px}</style><div id="view"></div><aside><strong>足球 · 木箱 · 纸旗串灯</strong><div><button id="ball">足球</button><button id="crate">木箱</button><button id="bunting">纸旗串灯</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,TUNING,SMALL_COLLIDER} from '../src/config.js';import {localToWorld,rotate2,propMeta} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
function root(cfg){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k]}for(const a of Object.values(cfg.accessories||{}))root(a)}for(const c of Object.values(ASSETS))root(c);
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer),out=document.querySelector('#result'),checks=[];
const balls=LAYOUT.filter(s=>s.key==='ball'),crate=LAYOUT.find(s=>s.key==='crate'),bunting=LAYOUT.find(s=>s.key==='bunting');
function verify(name,p){checks.push({name,passed:p});if(!p)throw Error(name)}function print(){out.textContent=checks.map(x=>`${x.passed?'通过':'失败'}：${x.name}`).join('\n');out.dataset.status=checks.every(x=>x.passed)?'passed':'failed'}
const views={ball:()=>street.setCameraPose(new C.Cartesian3(balls[0].x,balls[0].y,.15),new C.Cartesian3(balls[0].x+.35,balls[0].y+.9,.5)),crate:()=>{const d=rotate2(.9,1.8,crate.ry);street.setCameraPose(new C.Cartesian3(crate.x,crate.y,.3),new C.Cartesian3(crate.x+d[0],crate.y+d[1],1.1))},bunting:()=>street.setCameraPose(new C.Cartesian3(2,.4,3.6),new C.Cartesian3(3.2,4.4,3.2))};
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU加载超时')}
async function gltf(uri){const bytes=await (await fetch(uri)).arrayBuffer(),n=new DataView(bytes).getUint32(12,true);return JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,n)))}
const tris=g=>g.meshes.flatMap(x=>x.primitives).reduce((t,q)=>t+g.accessors[q.indices].count/3,0);const toLocal=p=>C.Matrix4.multiplyByPoint(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),p,new C.Cartesian3());
const at=s=>localToWorld(street.frame,s.x,s.y,s.z||0);const pick=name=>street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).endsWith('/'+name));
function facing(e,ry){const f=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(e.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3()),l=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),f,new C.Cartesian3());return Math.abs(l.x-Math.sin(ry))<1e-6&&Math.abs(l.y-Math.cos(ry))<1e-6}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
async function fallback(name,cfg,spec,expect){const old=cfg.glb;cfg.glb='/assets/models/intentionally-missing.glb';try{const probe=new StreetScene(viewer);await probe.addObject(spec);verify(name,expect(probe));for(const e of probe.entities)viewer.entities.remove(e)}finally{cfg.glb=old}}
try{await street.build();views.ball();
// Football
const bm=pick('ball.glb');verify('两个足球共用正式GLB',bm.length===2&&balls.length===2);const gb=await gltf(ASSETS.ball.glb);verify(`足球${tris(gb)}三角面在500预算内`,tris(gb)<=500);verify('足球1K颜色与法线贴图、不透明',gb.images.length===2&&gb.materials.every(m=>(m.alphaMode||'OPAQUE')==='OPAQUE'));
for(let i=0;i<2;i++){const s=balls[i],e=bm.find(m=>C.Cartesian3.distance(m.position.getValue(),at(s))<1e-6);verify(`足球${i+1}贴在${s.z?'街道铺装':'广场'}上`,!!e);const p=await ready(e);verify(`足球${i+1} GPU就绪、米制`,p.ready&&e.model.scale.getValue()===1&&e.model.minimumPixelSize.getValue()===0);const c=toLocal(p.boundingSphere.center);verify(`足球${i+1}直径${ASSETS.ball.height}米居中`,Math.hypot(c.x-s.x,c.y-s.y)<.01&&Math.abs(c.z-(s.z||0)-ASSETS.ball.height/2)<.01);verify(`足球${i+1}阻挡且可贴边绕过`,street.blocked(s.x,s.y)&&!street.blocked(s.x+SMALL_COLLIDER.ball+TUNING.heroRadius+.03,s.y))}
verify('足球碰撞为半径收缩8%',Math.abs(SMALL_COLLIDER.ball-ASSETS.ball.height/2*.92)<.005);
// Crate
const cm=pick('crate.glb');verify('正式木箱替换占位',cm.length===1);const ce=cm[0],cp=await ready(ce);verify('木箱 GPU就绪、米制',cp.ready&&ce.model.scale.getValue()===1&&ce.model.minimumPixelSize.getValue()===0);verify('木箱立在街道铺装上',C.Cartesian3.distance(ce.position.getValue(),at(crate))<1e-6);verify(`木箱按布局旋转${crate.ry}弧度`,facing(ce,crate.ry));
const cc=toLocal(cp.boundingSphere.center);verify('木箱0.6米立方居中',Math.hypot(cc.x-crate.x,cc.y-crate.y)<.01&&Math.abs(cc.z-(crate.z||0)-.3)<.01);const gc=await gltf(ASSETS.crate.glb);verify(`木箱${tris(gc)}三角面在300预算内`,tris(gc)<=300);
const cb=propMeta(crate).box;verify('木箱碰撞收缩8%',Math.abs(ASSETS.crate.collider.footprint[1]*2-.552)<1e-6&&cb.height===.6);verify('木箱阻挡且可绕过',street.blocked(crate.x,crate.y)&&!street.blocked(cb.x1+TUNING.heroRadius+.03,(cb.y0+cb.y1)/2));
// Bunting
const um=pick('bunting.glb');verify('正式纸旗串灯替换占位',um.length===1);const ue=um[0],up=await ready(ue);verify('纸旗串灯 GPU就绪、米制',up.ready&&ue.model.scale.getValue()===1);verify('立柱立在街道铺装上',C.Cartesian3.distance(ue.position.getValue(),at(bunting))<1e-6);
const gu=await gltf(ASSETS.bunting.glb),flags=gu.materials.find(m=>m.name==='bunting_flags'),bulb=gu.materials.find(m=>m.name==='bunting_bulb');verify('纸旗图集贴图、双面显示',!!flags?.pbrMetallicRoughness?.baseColorTexture&&flags.doubleSided===true);verify('串灯灯泡#FFD79A发光强度3.0',bulb?.extensions?.KHR_materials_emissive_strength?.emissiveStrength===3&&bulb.emissiveFactor?.[0]>.99);verify('没有实时灯或摄像机',[gb,gc,gu].every(g=>!g.cameras?.length&&!g.extensions?.KHR_lights_punctual));
const uc=toLocal(up.boundingSphere.center);verify('串灯跨度17.8米、居中',Math.abs(uc.x-bunting.x)<.05&&Math.abs(uc.y-bunting.y)<.05&&up.boundingSphere.radius>8.9);
verify('两根立柱阻挡',[-8.9,8.9].every(x=>street.blocked(bunting.x+x,bunting.y)));verify('纸旗与绳索不阻挡通行',!street.blocked(bunting.x,bunting.y)&&!street.blocked(bunting.x+4,bunting.y));
for(let i=0;i<3;i++){street.placeDog(i);street.s.playing=true;street.s.found=false;verify(`藏点${i+1}绕行可达并可确认`,route())}
await fallback('足球缺失回退占位并保留碰撞',ASSETS.ball,balls[0],p=>p.entities.length===4&&p.entities.every(e=>!e.model)&&p.colliders.length===1);
await fallback('木箱缺失回退占位并保留碰撞',ASSETS.crate,crate,p=>p.entities.length===3&&p.entities.every(e=>!e.model)&&p.colliders.length===1);
await fallback('串灯缺失回退占位并保留立柱碰撞',ASSETS.bunting,bunting,p=>p.entities.length>20&&p.entities.every(e=>!e.model)&&p.colliders.length===2);
const v=location.hash.slice(1);(views[v]||views.ball)();print();for(const k in views)document.querySelector('#'+k).onclick=views[k];
}catch(e){print();out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
