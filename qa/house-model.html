<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>房屋三配色验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:310px;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{margin:4px;padding:8px}</style><div id="view"></div><aside><strong>房屋三配色 · 正式GLB</strong><div><button id="front">正面</button><button id="back">背面</button><button id="fallback">缺失文件回退</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,DOG_SPOTS,TUNING} from '../src/config.js';import {createModelEntity,propMeta,localToWorld} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
for(const cfg of Object.values(ASSETS)){for(const item of Object.values(cfg.accessories||{})){if(item.glb&&!item.glb.startsWith('/'))item.glb='/'+item.glb;}}
for(const cfg of Object.values(ASSETS)){if(cfg.glb)cfg.glb='/'+cfg.glb;for(const k in cfg.variants)cfg.variants[k]='/'+cfg.variants[k];}
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer);const out=document.querySelector('#result');const checks=[];
function verify(n,p){checks.push({name:n,passed:p});if(!p)throw Error(n)}function print(){out.textContent=checks.map(c=>`${c.passed?'通过':'失败'}：${c.name}`).join('\n');out.dataset.status=checks.every(c=>c.passed)?'passed':'failed'}
function look(back=false){street.setCameraPose(new C.Cartesian3(0,-5,2),new C.Cartesian3(back?1:3,back?-30:20,13));}
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU超时')}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
try{await street.build();look();
const houses=street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).includes('house_'));verify('三栋均使用正式GLB',houses.length===3);verify('三个独立配色文件',new Set(houses.map(e=>e.model.uri.getValue())).size===3);
for(let i=0;i<3;i++){const e=houses[i],s=LAYOUT[i],p=await ready(e);verify(`房屋${i+1} GPU渲染`,p.ready);verify(`房屋${i+1}真实比例`,e.model.scale.getValue()===1&&e.model.minimumPixelSize.getValue()===0);verify(`房屋${i+1}贴地位置`,C.Cartesian3.distance(e.position.getValue(),localToWorld(street.frame,s.x,s.y,0))<1e-6);verify(`房屋${i+1}材质独立于渲染染色`,!e.model.color);const front=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(e.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3());const local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),front,new C.Cartesian3());verify(`房屋${i+1}正面朝街道`,Math.abs(local.x)<1e-6&&Math.abs(local.y-1)<1e-6);}
const meta=propMeta(LAYOUT[0]);verify('独立碰撞盒收缩8%',Math.abs(meta.box.x1-meta.box.x0-5.06)<1e-6&&Math.abs(meta.box.y1-meta.box.y0-4.14)<1e-6);verify('墙体阻挡',street.blocked(-6,-5));verify('两栋间可步行',!street.blocked(-3,-5)&&!street.blocked(3,-5));
for(let i=0;i<3;i++){street.placeDog(i);street.s.playing=true;street.s.found=false;verify(`藏点${i+1}可绕行并确认`,route());}
look();print();document.querySelector('#front').onclick=()=>look();document.querySelector('#back').onclick=()=>look(true);
document.querySelector('#fallback').onclick=async()=>{const old=ASSETS.house.variants.b;ASSETS.house.variants.b='/assets/models/intentionally-missing-house.glb';try{const probe=new StreetScene(viewer);await probe.addObject(LAYOUT[1]);verify('单个变体缺失回退占位',probe.entities.length>1&&probe.entities.every(e=>!e.model));for(const e of probe.entities)viewer.entities.remove(e);print()}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed'}finally{ASSETS.house.variants.b=old}};
}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
