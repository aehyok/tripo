<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小年动画验收</title>
<style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;background:#181c35ed;color:white;padding:14px;width:340px;font:13px/1.45 sans-serif;max-height:93vh;overflow:auto}button{padding:7px;margin:3px}pre{white-space:pre-wrap}#mode{color:#ffcf6a}</style>
<div id="view"></div><aside><strong>小年动画验收</strong><div><button id="idle">待机</button><button id="walk">行走</button><button id="crouch">蹲下</button><button id="stand">站起</button><button id="fallback">测试文件缺失回退</button></div><div id="mode"></div><pre id="result">等待模型…</pre></aside>
<script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';
import * as C from 'cesium';
import {StreetScene} from '../src/scenes/street.js';
import {ASSETS,TUNING} from '../src/config.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
for(const cfg of Object.values(ASSETS)){for(const item of Object.values(cfg.accessories||{})){if(item.glb&&!item.glb.startsWith('/'))item.glb='/'+item.glb;}}
for(const cfg of Object.values(ASSETS)){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k];}}
ASSETS.hero.glb='/assets/models/hero_xiaonian.glb';ASSETS.dog.glb='/assets/models/dog_jina.glb';
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});
viewer.scene.globe.show=false;
const street=new StreetScene(viewer);const result=document.querySelector('#result');const checks=[];
const verify=(name,pass,detail='')=>{checks.push({name,pass,detail});if(!pass)throw Error(name+':'+detail)};
const print=()=>{result.textContent=checks.map(c=>`${c.pass?'通过':'失败'}：${c.name}${c.detail?' · '+c.detail:''}`).join('\n');result.dataset.status=checks.every(c=>c.pass)?'passed':'failed'};
const frames=(n=3)=>new Promise(resolve=>{let count=0;const remove=viewer.scene.postRender.addEventListener(()=>{if(++count>=n){remove();resolve()}})});
let speed=0,running=false,last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;if(running){street.heroAvatar?.update(dt,speed);document.querySelector('#mode').textContent='当前动作：'+street.heroAvatar?.currentClip}requestAnimationFrame(loop)}requestAnimationFrame(loop);
try{
 await street.build();street.s.x=0;street.s.y=5;street.s.yaw=.35;
 street.setCameraPose(new C.Cartesian3(0,5,.78),new C.Cartesian3(2,7.8,1.7));
 const avatar=street.heroAvatar;verify('正式模型替换占位',!!avatar?.model&&street.heroEntities.length===0);
 const deadline=performance.now()+20000;while(!avatar.model.ready&&performance.now()<deadline)await frames();
 verify('GPU蒙皮渲染就绪',avatar.model.ready);verify('关闭动画钳制',!avatar.model.clampAnimations);
 avatar.update(0,0);await frames();verify('初始只播放idle',avatar.currentClip==='idle'&&avatar.model.activeAnimations.length===1);
 street.s.playing=true;avatar.update(.016,TUNING.walkSpeed);await frames();verify('移动切换walk',avatar.currentClip==='walk'&&avatar.model.activeAnimations.length===1);
 const before=C.Matrix4.clone(avatar.model.getNode('mixamorig:LeftLeg').matrix);avatar.update(.08,TUNING.walkSpeed);await frames();const after=avatar.model.getNode('mixamorig:LeftLeg').matrix;
 verify('行走实际驱动腿骨',!C.Matrix4.equalsEpsilon(before,after,1e-4));
 verify('按实际移动速度推进步态',Math.abs(avatar.elapsed-.08*TUNING.walkSpeed/2.2)<1e-6);
 avatar.update(.016,0);await frames();verify('停止切回idle',avatar.currentClip==='idle'&&avatar.model.activeAnimations.length===1);
 street.setCrouch(true);avatar.update(.01,0);await frames();verify('蹲下先播放过渡',avatar.currentClip==='crouch_down');
 avatar.update(.3,0);await frames();verify('过渡后保持crouch',avatar.currentClip==='crouch'&&avatar.model.activeAnimations.length===1);
 const crouchHip=C.Matrix4.clone(avatar.model.getNode('mixamorig:Hips').matrix);
 street.setCrouch(false);avatar.update(.01,0);verify('站起先播放过渡',avatar.currentClip==='crouch_up');avatar.update(.3,0);await frames();verify('站起恢复idle',avatar.currentClip==='idle');
 const idleHip=avatar.model.getNode('mixamorig:Hips').matrix;verify('蹲姿实际降低髋部',C.Cartesian3.distance(C.Matrix4.getTranslation(crouchHip,new C.Cartesian3()),C.Matrix4.getTranslation(idleHip,new C.Cartesian3()))>.2);
 street.setCrouch(true);avatar.update(.1,0);const progress=avatar.elapsed;street.setCrouch(false);avatar.update(0,0);verify('中途松开反向衔接',avatar.currentClip==='crouch_up'&&Math.abs(avatar.elapsed-(.25-progress))<1e-6);avatar.update(.3,0);
 street.s.x=0;street.s.y=5;street.s.camYaw=Math.PI;street.s.yawBias=0;street.keys.KeyW=true;street.move(.1);verify('实际移动产生步速',street.heroSpeed>0);street.keys.KeyW=false;
 const oldColliders=street.colliders;street.colliders=[{x0:-1,x1:1,y0:street.s.y+.31,y1:street.s.y+1}];street.keys.KeyW=true;street.move(.1);street.keys.KeyW=false;avatar.update(.1,street.heroSpeed);verify('碰撞阻挡时不原地踏步',street.heroSpeed<.02&&avatar.currentClip==='idle');street.colliders=oldColliders;
 for(const yaw of [0,Math.PI/2,Math.PI]){street.s.yaw=yaw;avatar.update(0,0);const rotation=C.Matrix4.getMatrix3(avatar.model.modelMatrix,new C.Matrix3());const world=C.Matrix3.multiplyByVector(rotation,C.Cartesian3.UNIT_X,new C.Cartesian3());const local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),world,new C.Cartesian3());verify('转向'+Math.round(yaw*180/Math.PI)+'度',Math.abs(local.x-Math.sin(yaw))<1e-6&&Math.abs(local.y-Math.cos(yaw))<1e-6)}
 street.s.x=0;street.s.y=0;avatar.update(0,0);const relative=C.Matrix4.multiply(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),avatar.model.modelMatrix,new C.Matrix4());verify('贴合4厘米街道铺装',Math.abs(relative[14]-.04)<1e-5);
 // Double-tap run through real key events: same direction twice, arrows count as WASD, release or crouch ends it.
 const key=(type,code)=>window.dispatchEvent(new KeyboardEvent(type,{code,bubbles:true}));const tap=code=>{key('keydown',code);key('keyup',code)};
 street.bindInput();const wasActive=street.active;street.active=true;street.s.playing=true;street.s.x=0;street.s.y=5;street.s.camYaw=Math.PI;street.yawBias=0;street.clearInput();
 tap('KeyW');key('keydown','KeyW');verify('双击W进入奔跑',street.s.running===true);street.move(.1);verify('奔跑速度4.4米/秒',Math.abs(street.heroSpeed-TUNING.runSpeed)<.05);
 avatar.play('walk',.123);avatar.update(.016,street.heroSpeed);const carried=.123+.016*street.heroSpeed/2.2;verify('切换run并保持步伐相位',avatar.currentClip==='run'&&Math.abs(avatar.elapsed-carried)<1e-9&&avatar.model.activeAnimations.length===1);
 avatar.update(.1,street.heroSpeed);verify('run按实际速度推进',Math.abs(avatar.elapsed-(carried+.1*street.heroSpeed/4.4))<1e-6);
 key('keyup','KeyW');street.move(.1);avatar.update(.016,street.heroSpeed);verify('松开方向键结束奔跑并停下',!street.s.running&&avatar.currentClip==='idle');
 street.s.x=0;street.s.y=5;tap('ArrowUp');key('keydown','KeyW');verify('↑与W视为同一方向',street.s.running===true);street.toggleCrouch();verify('蹲下结束奔跑',!street.s.running&&street.s.crouch);
 street.clearInput();tap('KeyW');key('keydown','KeyW');verify('蹲下时双击不奔跑',!street.s.running);street.toggleCrouch();street.clearInput();
 tap('KeyW');key('keydown','KeyS');verify('不同方向不触发奔跑',!street.s.running);street.clearInput();
 street.tapDirection('KeyD',1000);street.tapDirection('KeyD',1000+TUNING.doubleTapMs+1);verify('间隔超过300毫秒不触发奔跑',!street.s.running);street.clearInput();
 street.s.x=0;street.s.y=5;tap('KeyD');key('keydown','KeyD');street.move(.1);avatar.update(.016,street.heroSpeed);verify('双击D朝右侧奔跑',avatar.currentClip==='run'&&street.s.running);street.clearInput();street.move(.1);avatar.update(.016,0);street.active=wasActive;
 const glb=await (await fetch(ASSETS.hero.glb)).arrayBuffer(),jl=new DataView(glb).getUint32(12,true),hg=JSON.parse(new TextDecoder().decode(new Uint8Array(glb,20,jl)));verify('GLB包含run动画',hg.animations.some(x=>x.name==='run'));
 street.s.y=5;street.s.yaw=.35;street.s.playing=false;avatar.update(.3,0);print();running=true;
 document.querySelector('#idle').onclick=()=>{street.s.playing=false;speed=0;street.setCrouch(false)};
 document.querySelector('#walk').onclick=()=>{street.s.playing=true;speed=TUNING.walkSpeed;street.setCrouch(false)};
 document.querySelector('#crouch').onclick=()=>street.setCrouch(true);
 document.querySelector('#stand').onclick=()=>street.setCrouch(false);
 document.querySelector('#fallback').onclick=async()=>{const original=ASSETS.hero.glb;ASSETS.hero.glb='/assets/models/intentionally-missing-hero.glb';const probe=new StreetScene(viewer);try{await probe.buildHero();verify('文件缺失回退占位',probe.heroEntities.length>1&&!probe.heroAvatar);for(const e of probe.heroEntities)viewer.entities.remove(e);print()}catch(e){result.textContent+='\n失败：'+e.message;result.dataset.status='failed'}finally{ASSETS.hero.glb=original}};
}catch(e){print();result.textContent+='\n失败：'+e.message;result.dataset.status='failed';console.error(e)}
</script></html>
