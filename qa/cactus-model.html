<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>仙人掌验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:300px;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{padding:7px;margin:3px}</style><div id="view"></div><aside><strong>盆栽仙人掌 · 两实例复用</strong><div><button id="first">东侧</button><button id="second">西侧</button><button id="back">背面</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,TUNING,SMALL_COLLIDER} from '../src/config.js';import {localToWorld,rotate2,propMeta} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
function root(cfg){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k]}for(const a of Object.values(cfg.accessories||{}))root(a)}for(const c of Object.values(ASSETS))root(c);
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer),specs=LAYOUT.filter(s=>s.key==='cactus'),out=document.querySelector('#result'),checks=[];let selected=0;
function verify(name,p){checks.push({name,passed:p});if(!p)throw Error(name)}function print(){out.textContent=checks.map(x=>`${x.passed?'通过':'失败'}：${x.name}`).join('\n');out.dataset.status=checks.every(x=>x.passed)?'passed':'failed'}
function look(i=selected,back=false){selected=i;const s=specs[i],d=rotate2(back?-.7:.7,back?-2.2:2.2,s.ry);street.setCameraPose(new C.Cartesian3(s.x,s.y,.6),new C.Cartesian3(s.x+d[0],s.y+d[1],1.3));}
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU加载超时')}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
try{await street.build();look(0);const models=street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).endsWith('/cactus.glb'));verify('两个实例共用正式GLB',models.length===2&&specs.length===2);
const bytes=await (await fetch(ASSETS.cactus.glb)).arrayBuffer(),n=new DataView(bytes).getUint32(12,true),g=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,n))),tri=g.meshes.flatMap(x=>x.primitives).reduce((t,p)=>t+g.accessors[p.indices].count/3,0);
verify(`${tri}三角面在1,000预算内`,tri<=1000);verify('三张1K贴图、不透明哑光',g.images.length===3&&g.materials.length===1&&g.materials.every(x=>(x.alphaMode||'OPAQUE')==='OPAQUE'&&x.pbrMetallicRoughness?.metallicFactor===0));verify('没有实时灯或摄像机',!g.cameras?.length&&!g.extensions?.KHR_lights_punctual);
for(let i=0;i<2;i++){const s=specs[i],e=models.find(m=>C.Cartesian3.distance(m.position.getValue(),localToWorld(street.frame,s.x,s.y,s.z||0))<1e-6);verify(`实例${i+1}盆底贴地于布局位置`,!!e);const p=await ready(e);verify(`实例${i+1} GPU就绪`,p.ready);verify(`实例${i+1}米制且不强制放大`,e.model.scale.getValue()===1&&e.model.minimumPixelSize.getValue()===0);
 const f=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(e.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3()),local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),f,new C.Cartesian3());verify(`实例${i+1}按布局旋转${s.ry}弧度`,Math.abs(local.x-Math.sin(s.ry))<1e-6&&Math.abs(local.y-Math.cos(s.ry))<1e-6);
 const c=C.Matrix4.multiplyByPoint(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),p.boundingSphere.center,new C.Cartesian3());verify(`实例${i+1}总高1.1米居中`,Math.hypot(c.x-s.x,c.y-s.y)<.02&&Math.abs(c.z-(s.z||0)-.55)<.02);
 verify(`实例${i+1}花盆阻挡`,street.blocked(s.x,s.y));verify(`实例${i+1}可贴盆边绕过`,!street.blocked(s.x+SMALL_COLLIDER.cactus+TUNING.heroRadius+.03,s.y));const b=propMeta(s).box;verify(`实例${i+1}提示区域覆盖盆和侧枝`,b.x1-b.x0>=.68&&b.y1-b.y0>=.63&&b.height===1.1);}
verify('碰撞盒为盆外半径收缩8%',Math.abs(SMALL_COLLIDER.cactus-.3255*.92)<.005);
for(let i=0;i<3;i++){street.placeDog(i);street.s.playing=true;street.s.found=false;verify(`藏点${i+1}绕行可达并可确认`,route())}
const old=ASSETS.cactus.glb;ASSETS.cactus.glb='/assets/models/intentionally-missing-cactus.glb';try{const probe=new StreetScene(viewer);await probe.addObject(specs[0]);verify('文件缺失回退占位并保留碰撞',probe.entities.length===6&&probe.entities.every(e=>!e.model)&&probe.colliders.length===1);for(const e of probe.entities)viewer.entities.remove(e)}finally{ASSETS.cactus.glb=old}
look(location.hash==='#second'?1:0,location.hash==='#back');print();document.querySelector('#first').onclick=()=>look(0);document.querySelector('#second').onclick=()=>look(1);document.querySelector('#back').onclick=()=>look(selected,true);
}catch(e){print();out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
