<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>球迷摊位验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:300px;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{padding:7px;margin:3px}</style><div id="view"></div><aside><strong>球迷摊位 · 共用模型与独立商品</strong><div><button id="scarf">围巾摊位</button><button id="caps">球迷帽摊位</button><button id="back">背面</button><button id="fallback">测试摊位缺失回退</button><button id="goodsFallback">测试商品缺失回退</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,DOG_SPOTS,TUNING} from '../src/config.js';import {localToWorld,rotate2,propMeta} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
function root(cfg){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k];}for(const a of Object.values(cfg.accessories||{}))root(a)}for(const cfg of Object.values(ASSETS))root(cfg);
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer);const specs=LAYOUT.filter(s=>s.key==='stall');const checks=[];const out=document.querySelector('#result');let selected=0;
function verify(name,p){checks.push({name,passed:p});if(!p)throw Error(name)}function print(){out.textContent=checks.map(x=>`${x.passed?'通过':'失败'}：${x.name}`).join('\n');out.dataset.status=checks.every(x=>x.passed)?'passed':'failed'}
function look(i=selected,back=false){selected=i;const s=specs[i],d=rotate2(back?-1.8:1.8,back?-5.5:5.5,s.ry);street.setCameraPose(new C.Cartesian3(s.x,s.y,1.1),new C.Cartesian3(s.x+d[0],s.y+d[1],2.8));}
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU加载超时')}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
try{await street.build();look(0);const bases=street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).endsWith('/stall.glb'));const goods=street.entities.filter(e=>e.model&&/stall_(scarf|caps)\.glb$/.test(String(e.model.uri.getValue())));
verify('两个实例共用同一基础GLB',bases.length===2&&new Set(bases.map(e=>e.model.uri.getValue())).size===1);verify('围巾与帽子独立于基础模型',goods.length===2);
const bytes=await (await fetch(ASSETS.stall.glb)).arrayBuffer(),jsonLength=new DataView(bytes).getUint32(12,true),gltf=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,jsonLength)));verify('暖色灯泡发光强度1.5',gltf.materials.some(m=>m.name==='stall_warm_bulb'&&m.emissiveFactor?.[0]>0&&m.extensions?.KHR_materials_emissive_strength?.emissiveStrength===1.5));

for(let i=0;i<2;i++){const s=specs[i],base=bases[i],item=goods[i];verify(`摊位${i+1} GPU就绪`,(await ready(base)).ready);verify(`商品${i+1} GPU就绪`,(await ready(item)).ready);verify(`摊位${i+1}米制且不强制放大`,base.model.scale.getValue()===1&&base.model.minimumPixelSize.getValue()===0);verify(`摊位${i+1}贴地`,C.Cartesian3.distance(base.position.getValue(),localToWorld(street.frame,s.x,s.y,s.z||0))<1e-6);
 const f=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(base.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3());const local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),f,new C.Cartesian3());verify(`摊位${i+1}旋转朝向`,Math.abs(local.x-Math.sin(s.ry))<1e-6&&Math.abs(local.y-Math.cos(s.ry))<1e-6);
 const cfg=ASSETS.stall.accessories[s.accessory];verify(`商品${i+1}台面高度与摊位朝向`,C.Cartesian3.distance(item.position.getValue(),localToWorld(street.frame,s.x,s.y,(s.z||0)+cfg.z))<1e-6&&C.Quaternion.equalsEpsilon(base.orientation.getValue(),item.orientation.getValue(),1e-7));verify(`摊位${i+1}柜台阻挡`,street.blocked(s.x,s.y));
 const [dx,dy]=rotate2(0,.92,s.ry);verify(`摊位${i+1}篷布外沿不封路`,!street.blocked(s.x+dx,s.y+dy));}
const box=propMeta(specs[0]).box;verify('柜台代理收缩8%且不含屋顶',Math.abs(box.x1-box.x0-2.1528)<1e-6&&Math.abs(box.y1-box.y0-.9752)<1e-6&&box.height===.85);verify('商品不增加碰撞代理',street.sights.filter(x=>x.key==='stall').length===2&&street.sights.every(x=>!x.key.startsWith('stall_')));verify('两摊位提示与商品匹配',specs[0].accessory==='scarf'&&specs[0].say.includes('一条围巾')&&specs[1].accessory==='caps'&&specs[1].say.includes('球迷帽'));
for(let i=0;i<3;i++){street.placeDog(i);street.s.playing=true;street.s.found=false;verify(`藏点${i+1}绕行可达并可确认`,route())}look(0);print();
document.querySelector('#scarf').onclick=()=>look(0);document.querySelector('#caps').onclick=()=>look(1);document.querySelector('#back').onclick=()=>look(selected,true);
document.querySelector('#fallback').onclick=async()=>{const old=ASSETS.stall.glb;ASSETS.stall.glb='/assets/models/intentionally-missing-stall.glb';try{const probe=new StreetScene(viewer);await probe.addObject(specs[0]);verify('基础文件缺失时完整回退占位',probe.entities.length>1&&probe.entities.every(e=>!e.model)&&probe.colliders.length===1);for(const e of probe.entities)viewer.entities.remove(e);print()}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed'}finally{ASSETS.stall.glb=old}};
document.querySelector('#goodsFallback').onclick=async()=>{const old=ASSETS.stall.accessories.scarf.glb;ASSETS.stall.accessories.scarf.glb='/assets/models/intentionally-missing-scarf.glb';try{const probe=new StreetScene(viewer);await probe.addObject(specs[0]);verify('商品缺失保留摊位并回退商品',probe.entities.filter(e=>e.model).length===1&&probe.entities.some(e=>!e.model)&&probe.colliders.length===1);for(const e of probe.entities)viewer.entities.remove(e);print()}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed'}finally{ASSETS.stall.accessories.scarf.glb=old}};
}catch(e){out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
