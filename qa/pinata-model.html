<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>皮纳塔验收</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}aside{position:absolute;top:12px;left:12px;max-width:300px;padding:14px;background:#171a35ee;color:#fff;font:13px/1.5 sans-serif}pre{white-space:pre-wrap}button{padding:7px;margin:3px}</style><div id="view"></div><aside><strong>皮纳塔 · 星体与悬挂架</strong><div><button id="front">正面</button><button id="back">背面</button></div><pre id="result">加载中…</pre></aside><script type="module">
import 'cesium/Build/Cesium/Widgets/widgets.css';import * as C from 'cesium';import {StreetScene} from '../src/scenes/street.js';import {ASSETS,LAYOUT,DOG_SPOTS,TUNING} from '../src/config.js';import {localToWorld,rotate2,propMeta} from '../src/scenes/streetProps.js';
C.buildModuleUrl.setBaseUrl('/cesium/');
function root(cfg){if(cfg.glb&&!cfg.glb.startsWith('/'))cfg.glb='/'+cfg.glb;for(const k in cfg.variants){if(!cfg.variants[k].startsWith('/'))cfg.variants[k]='/'+cfg.variants[k]}for(const a of Object.values(cfg.accessories||{}))root(a)}for(const c of Object.values(ASSETS))root(c);
const viewer=new C.Viewer('view',{baseLayer:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});viewer.scene.globe.show=false;const street=new StreetScene(viewer),spec=LAYOUT.find(s=>s.key==='pinata'),body=ASSETS.pinata.accessories.body,out=document.querySelector('#result'),checks=[];
function verify(name,p){checks.push({name,passed:p});if(!p)throw Error(name)}function print(){out.textContent=checks.map(x=>`${x.passed?'通过':'失败'}：${x.name}`).join('\n');out.dataset.status=checks.every(x=>x.passed)?'passed':'failed'}
function look(back=false){const m=rotate2(body.x,0,spec.ry),d=rotate2(back?-1.2:1.2,back?-4.5:4.5,spec.ry);street.setCameraPose(new C.Cartesian3(spec.x+m[0]/2,spec.y+m[1]/2,2.2),new C.Cartesian3(spec.x+d[0],spec.y+d[1],2.6));}
async function ready(e){const end=performance.now()+20000;while(performance.now()<end){for(let i=0;i<viewer.scene.primitives.length;i++){const p=viewer.scene.primitives.get(i);if(p.id===e&&p.ready)return p}await new Promise(r=>setTimeout(r,100))}throw Error('GPU加载超时')}
async function gltf(uri){const bytes=await (await fetch(uri)).arrayBuffer(),n=new DataView(bytes).getUint32(12,true);return JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,n)))}
function toLocal(p){return C.Matrix4.multiplyByPoint(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),p,new C.Cartesian3())}
function route(){const step=.2,start=[Math.round(TUNING.spawn.x/step),Math.round(TUNING.spawn.y/step)],q=[start],seen=new Set([start.join(',')]);for(let h=0;h<q.length;h++){const [ix,iy]=q[h];street.s.x=ix*step;street.s.y=iy*step;if(street.canConfirm())return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy,k=nx+','+ny;if(!seen.has(k)&&!street.blocked(nx*step,ny*step)){seen.add(k);q.push([nx,ny])}}}return false}
try{await street.build();look();const pick=name=>street.entities.filter(e=>e.model&&String(e.model.uri.getValue()).endsWith('/'+name));const hangers=pick('pinata_hanger.glb'),stars=pick('pinata.glb');verify('正式悬挂架与星体替换占位',hangers.length===1&&stars.length===1);const [h,s]=[hangers[0],stars[0]];
const hp=await ready(h),sp=await ready(s);verify('Cesium GPU渲染就绪',hp.ready&&sp.ready);verify('米制比例且不强制放大',[h,s].every(e=>e.model.scale.getValue()===1&&e.model.minimumPixelSize.getValue()===0));verify('立柱底部贴地',C.Cartesian3.distance(h.position.getValue(),localToWorld(street.frame,spec.x,spec.y,spec.z||0))<1e-6);
const m=rotate2(body.x,0,spec.ry);verify('星体挂在横臂末端、最低尖角离地1.9米',C.Cartesian3.distance(s.position.getValue(),localToWorld(street.frame,spec.x+m[0],spec.y+m[1],(spec.z||0)+body.z))<1e-6&&C.Quaternion.equalsEpsilon(h.orientation.getValue(),s.orientation.getValue(),1e-7));
const f=C.Matrix3.multiplyByVector(C.Matrix3.fromQuaternion(h.orientation.getValue()),C.Cartesian3.UNIT_X,new C.Cartesian3()),local=C.Matrix4.multiplyByPointAsVector(C.Matrix4.inverseTransformation(street.frame,new C.Matrix4()),f,new C.Cartesian3());verify('按布局0.4弧度旋转',Math.abs(local.x-Math.sin(spec.ry))<1e-6&&Math.abs(local.y-Math.cos(spec.ry))<1e-6);
// Bounding-sphere centres prove the arm reaches toward the star instead of a mirrored side.
const hc=toLocal(hp.boundingSphere.center),arm=rotate2(.5325,0,spec.ry);verify('横臂朝向星体一侧',Math.hypot(hc.x-spec.x-arm[0],hc.y-spec.y-arm[1])<.03&&Math.abs(hc.z-(spec.z||0)-1.85)<.03);
const sc=toLocal(sp.boundingSphere.center);verify('绳底与星体顶角对齐',Math.hypot(sc.x-spec.x-m[0],sc.y-spec.y-m[1])<.03&&Math.abs(sc.z-(spec.z||0)-body.z-.5)<.03&&Math.abs(sp.boundingSphere.radius-Math.hypot(1.0257,.5155,1)/2)<.03);
const g1=await gltf(body.glb),g2=await gltf(ASSETS.pinata.glb),tri=g=>g.meshes.flatMap(x=>x.primitives).reduce((n,p)=>n+g.accessors[p.indices].count/3,0);verify(`星体${tri(g1)}三角面在1,500预算内`,tri(g1)<=1500);verify('星体三张1K贴图、不透明纸质',g1.images.length===3&&g1.materials.every(x=>(x.alphaMode||'OPAQUE')==='OPAQUE'&&(x.pbrMetallicRoughness?.metallicFactor??1)===0));verify('悬挂架纯色材质、无贴图',!g2.images?.length&&g2.materials.length===2);verify('没有实时灯或摄像机',[g1,g2].every(g=>!g.cameras?.length&&!g.extensions?.KHR_lights_punctual));
verify('最低尖角高于小年头顶',body.z>ASSETS.hero.height+.3);verify('立柱阻挡',street.blocked(spec.x,spec.y));verify('星体下方可通行',!street.blocked(spec.x+m[0],spec.y+m[1]));const b=propMeta(spec).box;verify('提示区域覆盖星体',b.x0<spec.x+m[0]-.5&&b.x1>spec.x+m[0]+.5&&b.y0<spec.y+m[1]&&b.y1>spec.y+m[1]);
for(let i=0;i<3;i++){street.placeDog(i);street.s.playing=true;street.s.found=false;verify(`藏点${i+1}绕行可达并可确认`,route())}
async function fallback(name,swap,expect){const [obj,key]=swap,old=obj[key];obj[key]='/assets/models/intentionally-missing-'+key+'.glb';try{const probe=new StreetScene(viewer);await probe.addObject(spec);verify(name,expect(probe));for(const e of probe.entities)viewer.entities.remove(e)}finally{obj[key]=old}}
await fallback('悬挂架缺失时完整回退占位并保留碰撞',[ASSETS.pinata,'glb'],p=>p.entities.length>8&&p.entities.every(e=>!e.model)&&p.colliders.length===1);
await fallback('星体缺失时保留悬挂架并回退占位星体',[body,'glb'],p=>p.entities.filter(e=>e.model).length===1&&p.entities.filter(e=>!e.model).length===8&&p.colliders.length===1);
look(location.hash==='#back');print();document.querySelector('#front').onclick=()=>look();document.querySelector('#back').onclick=()=>look(true);
}catch(e){print();out.textContent+='\n失败：'+e.message;out.dataset.status='failed';console.error(e)}
</script></html>
